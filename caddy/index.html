<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ableton Caddy</title>
<style>
:root{color-scheme:dark;--bg:#171b1a;--panel:#222927;--border:#3b4742;--text:#eef2e9;--muted:#bdc9c0;--accent:#d4f68b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:42px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.06em;margin:0}h2{font-size:1.15rem;margin:0 0 10px}p{margin:0 0 12px}.muted,small{color:var(--muted)}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--border);padding:9px 12px;border-radius:7px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:#18220b;font-weight:650}.layout{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr);gap:20px;margin-top:22px}aside,article,.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}aside{align-self:start;position:sticky;top:18px}label{display:block;margin-top:12px}select{display:block;width:100%;margin-top:5px}#note{white-space:pre-wrap;width:100%;min-height:130px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:10px;font:inherit;resize:vertical}.card{display:block;width:100%;text-align:left;margin-top:9px;background:var(--bg)}.card strong,.card span{display:block}.card span{color:var(--muted);margin-top:4px}.card[aria-pressed=true]{border-color:var(--accent)}#chain{overflow-wrap:anywhere}#status{margin:14px 0 0}article{min-width:0}@media(max-width:690px){.layout{grid-template-columns:1fr}aside{position:static;order:2}}.chain-status{color:var(--muted);font-size:.86rem;margin-top:7px;overflow-wrap:anywhere}
</style>
<main>
<header><h1>Ableton Caddy</h1><span><button type="button" id="export">Export notes</button> <button type="button" id="refresh" class="primary">Refresh session</button></span></header>
<p id="status" class="muted" role="status"></p>
<div class="layout">
<aside aria-labelledby="info-title">
<h2 id="info-title">Workflow commentary</h2>
<p class="muted">Hover, focus, or select a suggestion to read the listening cues.</p>
<textarea id="note" aria-label="Workflow note" readonly></textarea>
<button id="copy" type="button" disabled>Copy for Live Info View</button>
<small id="copy-status" role="status"></small>
</aside>
<article>
<h2>Channel processing</h2>
<label>Track <select id="track"></select></label>
<label>Track role <select id="role">
<option value="auto">Auto from track name</option><option value="drums">Drums / percussion</option>
<option value="bass">Bass</option><option value="vocal">Vocal</option>
<option value="synth">Synth / melodic</option><option value="general">General / bus / return</option>
</select></label>
<label>Focus <select id="focus">
<option value="Ideas">Ideas</option><option value="Mixdown">Mixdown</option><option value="Compression">Compression</option>
<option value="FX">FX</option><option value="Workflow">Workflow</option>
</select></label>
<p id="chain" class="muted" style="margin-top:14px"></p>
<div id="cards"></div>
</article>
</div>
</main>
<script>
const demoSession = {
  "tempo": 124,
  "tracks": [
    {
      "index": 0,
      "name": "Kick",
      "devices": [
        "EQ Eight"
      ]
    },
    {
      "index": 1,
      "name": "Drum Group",
      "devices": [
        "Drum Buss"
      ]
    },
    {
      "index": 2,
      "name": "Sub Bass",
      "devices": [
        "Operator",
        "Utility"
      ]
    },
    {
      "index": 3,
      "name": "Lead Vocal",
      "devices": [
        "Compressor",
        "Echo"
      ]
    },
    {
      "index": 4,
      "name": "Synth Pad",
      "devices": [
        "Wavetable",
        "Chorus-Ensemble"
      ]
    }
  ],
  "return_tracks": [
    "A Reverb"
  ]
};
const recipes = {
  Ideas: [
    ["Shape the groove", "Drum Rack or Beat Repeat → Auto Filter", "Try a one-bar variation or automate the filter in the last beat of a section. Audition it against the original groove.", "drums"],
    ["Separate sub and movement", "Instrument → Audio Effect Rack → Utility", "Try parallel clean and saturated paths. Keep the sub stable while automating movement on the upper harmonics. Check phase where the layers overlap.", "bass"],
    ["Turn a phrase into a transition", "Duplicate clip → Echo or Granulator III (Max for Live)", "Use one word or note as a throw. Resample the tail, reverse it, and audition the swell into the next phrase.", "vocal"],
    ["Make modulation part of the arrangement", "Max for Live LFO → Auto Filter or an exposed VST parameter", "Map a small range to filter cutoff or effect mix. Try a slower rate in the verse and a different rate in the transition.", "synth"],
    ["Create a parallel texture", "Audio Effect Rack → Saturator, Auto Filter or a favourite VST", "Keep one dry chain and blend a filtered or distorted parallel chain. Map the blend to a macro and automate only where the section needs contrast.", "general"],
  ],
  Mixdown: [
    ["Start with balances", "Faders and pan → Utility → Spectrum or EQ Eight", "Set a rough balance in context, then check mono and listen quietly. Use Spectrum to investigate a suspected overlap. Make an EQ move only after hearing the problem.", "general"],
    ["Make room for the kick", "EQ Eight or dynamic EQ VST (e.g. Pro-Q 4) → Utility", "Compare kick and bass while both play. If the clash is intermittent, audition a small dynamic cut. Verify that the bass still reads on smaller speakers.", "bass"],
    ["Tame intermittent harshness", "Clip gain → EQ Eight or dynamic EQ VST (e.g. TDR Nova) → Compressor", "Even out obvious phrase jumps first. Audition dynamic EQ when the harsh range appears only on certain words, and compare the result at matched loudness.", "vocal"],
    ["Clear space around the rhythm", "Faders → EQ Eight → Utility", "Check kick, snare and bass together. Compare overhead or room channels in mono before committing to broad EQ changes.", "drums"],
  ],
  Compression: [
    ["Preserve the transient", "Compressor or Glue Compressor", "Start with modest gain reduction. Let the attack pass enough of the initial hit, then adjust release by ear so gain recovers with the groove. Level-match bypass.", "drums"],
    ["Audition kick-triggered ducking", "Compressor with kick sidechain, or a sidechain-capable VST", "Use a small amount of reduction and tune the release around the kick and bass rhythm. Compare full-band ducking with band-limited dynamic EQ when only the low end overlaps.", "bass"],
    ["Level phrases in two stages", "Clip gain → Compressor → optional second leveller", "Use clip gain for the largest differences. Then compare gentle peak control and slower levelling. Bypass each stage at matched loudness and listen for consonants losing definition.", "vocal"],
    ["Compare broadband and multiband", "Compressor → optional Multiband Dynamics or multiband VST", "Try broadband compression first. If one frequency range keeps driving the response, audition a single targeted band. Check crossover tone and level-match before deciding.", "general"],
  ],
  FX: [
    ["Give the delay its own space", "Return track → Echo or delay VST → EQ Eight", "Try a filtered delay return and automate short throws at phrase ends. On a return, set the delay wet and blend with the track send.", "general"],
    ["Make a parallel drum colour", "Audio Effect Rack → dry and Saturator or Drum Buss chains", "Match the loudness between comparisons. If the parallel path softens the kick or snare unexpectedly, check the blend in mono.", "drums"],
    ["Keep vocal space behind the lead", "Reverb return → EQ Eight → Compressor sidechained from the vocal", "Let the dry vocal pull the reverb down during phrases. Set the release so the tail becomes audible in the gaps.", "vocal"],
    ["Move the pad across sections", "Chorus-Ensemble → Hybrid Reverb or an installed modulation VST", "Automate movement or decay into a transition. Check mono and keep enough of the dry sound to preserve the chord voicing.", "synth"],
  ],
  Workflow: [
    ["Compare two chain orders", "EQ → Compressor vs. Compressor → EQ", "Save a copy or use a duplicate track for comparison. Put corrective EQ first if a resonance drives the compressor; try compression first for a different response. Match levels before choosing.", "general"],
    ["Keep a reusable rack", "Audio Effect Rack → macros → saved User Library preset", "Map only the controls you will reach for, such as parallel blend, sidechain depth or send colour. Record what each macro does in the rack's Info Text.", "general"],
    ["Check third-party portability", "Installed VST3 or Max for Live device → stock alternative", "Confirm Live can see the plug-in and its preset. Save the rack and document dependencies; print a copy if the set needs to travel to a machine without those devices.", "general"],
  ],
};
const el = id => document.getElementById(id);
const track = el("track"), role = el("role"), focus = el("focus");
const note = el("note"), copy = el("copy"), status = el("status"), refresh = el("refresh");
let tracks = [];
let chosen = null;
const rolePatterns = {
  drums: /\b(kick|snare|hats?|drums?|percussion|clap)\b/i,
  bass: /\b(bass|sub|808)\b/i,
  vocal: /\b(vocals?|vox|vocoder|adlibs?)\b/i,
  synth: /\b(synths?|pads?|keys?|piano|arp|chords?)\b/i,
};

const toks = s => s.toLowerCase().replace(/-/g, " ").match(/[a-z0-9]+/g) || [];
function hasSeq(hay, needle) {
  if (!needle.length || needle.length > hay.length) return false;
  for (let i = 0; i + needle.length <= hay.length; i++) {
    if (needle.every((w, j) => hay[i + j] === w)) return true;
  }
  return false;
}
const norm = s => s.toLowerCase().replace(/-/g, " ");
// Stock device name → family alias words/phrases a recipe may use instead of the full
// name. Aliases match only as whole words (token subsequences), never inside a word.
const deviceAliases = {
  "eq eight": ["eq"], "channel eq": ["eq"],
  "glue compressor": ["compressor"], "compressor": ["compressor"], "multiband dynamics": ["compressor"],
  "echo": ["echo", "delay"], "chorus ensemble": ["chorus"],
  "hybrid reverb": ["reverb"], "reverb": ["reverb"],
  "auto filter": ["auto filter", "filter"], "filter df8": ["filter"],
};
// Stock device names that appear in the recipes; their words make a segment device-like.
const stockDevices = ["EQ Eight", "Channel EQ", "Glue Compressor", "Compressor", "Multiband Dynamics",
  "Utility", "Echo", "Chorus-Ensemble", "Saturator", "Drum Buss", "Hybrid Reverb", "Reverb",
  "Auto Filter", "Filter DF8", "Spectrum", "Drum Rack", "Beat Repeat", "Audio Effect Rack",
  "Granulator III", "Operator", "Wavetable"];
const deviceWords = new Set([stockDevices, Object.keys(deviceAliases),
  Object.values(deviceAliases).flat()].flat().map(norm).map(toks).flat());
function deviceMatches(st, name) {
  return hasSeq(st, toks(name)) ||
    (deviceAliases[norm(name)] || []).some(a => hasSeq(st, toks(a)));
}
function segmentState(seg, devices) {
  const st = toks(seg);
  if (devices.some(d => deviceMatches(st, d))) return "✓ " + seg;
  if (!st.some(t => deviceWords.has(t))) return seg;  // names no device: workflow step, no verdict
  const thirdParty = /\b(vst|max for live|m4l|nova|pro-q|third-party)\b/i.test(seg);
  const tag = thirdParty ? "not in chain · VST example unverified" : "not in chain";
  return "+ " + seg + " (" + tag + ")";
}
function chainStatus(card, row) {
  if (!Array.isArray(row.devices)) return "";
  return card[1].split("→").map(s => s.trim()).filter(Boolean)
    .map(seg => segmentState(seg, row.devices)).join("  ·  ");
}

function showNote(card, row) {
  const cardToks = toks(card[1]);
  const existing = (row.devices || []).filter(name => deviceMatches(cardToks, name));  // same matcher as chain status
  const reuse = existing.length ? "Already in this chain: " + existing.join(", ") +
    ". Audition those devices first." : "";
  const st = chainStatus(card, row);
  note.value = [row.name + " — " + card[0], card[1], card[2],
    st ? "Chain status: " + st : "", reuse].filter(Boolean).join("\n\n");
  copy.disabled = false;
  el("copy-status").textContent = "";
}

function render() {
  const row = tracks[track.selectedIndex];
  el("cards").replaceChildren();
  el("chain").textContent = "";
  el("copy-status").textContent = "";
  note.value = "";
  copy.disabled = true;
  chosen = null;
  if (!row) return;
  const chain = Array.isArray(row.devices) ? row.devices : null;
  el("chain").textContent = chain
    ? "Current chain: " + (chain.join(" → ") || "No devices")
    : "This session snapshot does not include the return’s device chain.";
  const guessed = Object.keys(rolePatterns).find(key => rolePatterns[key].test(row.name)) || "general";
  const selectedRole = role.value === "auto" ? guessed : role.value;
  const options = recipes[focus.value];
  const matching = options.filter(card => card[3] === selectedRole);
  const general = options.filter(card => card[3] === "general");
  for (const card of [...new Set([...matching, ...general])]) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    btn.setAttribute("aria-pressed", "false");
    const title = document.createElement("strong");
    const summary = document.createElement("span");
    title.textContent = card[0];
    summary.textContent = card[1];
    btn.append(title, summary);
    if (chain) {
      const st = document.createElement("span");
      st.className = "chain-status";
      st.textContent = chainStatus(card, row);
      btn.append(st);
    }
    for (const event of ["mouseenter", "focus"]) {
      btn.addEventListener(event, () => showNote(card, row));
    }
    btn.addEventListener("click", () => {
      if (chosen) chosen.setAttribute("aria-pressed", "false");
      chosen = btn;
      btn.setAttribute("aria-pressed", "true");
      showNote(card, row);
    });
    el("cards").append(btn);
  }
}

const demoMode = location.protocol === "file:" || new URLSearchParams(location.search).has("demo");
async function loadSession() {
  refresh.disabled = true;
  status.textContent = "Reading session…";
  try {
    let data = {demo: true, session: demoSession};
    if (!demoMode) {
      const reply = await fetch("/session", {headers: {"X-Ableton-Caddy": "1"}});
      const text = await reply.text();
      let payload = null;
      try { payload = JSON.parse(text); } catch {}
      if (!reply.ok) throw new Error((payload && payload.error) || "Server error (HTTP " + reply.status + ")");
      if (!payload || typeof payload !== "object") throw new Error("Server error (HTTP " + reply.status + ")");
      data = payload;
    }
    const prior = track.value;
    const session = data.session;
    tracks = [
      ...session.tracks,
      ...(session.return_tracks || []).map(name => ({name})),
    ];
    track.replaceChildren(...tracks.map((item, i) => {
      const key = i >= session.tracks.length ? "return:" + item.name
        : "track:" + (item.id == null ? i + ":" + item.name : session.snapshot_scope + ":" + item.id);
      return new Option(item.name, key);
    }));
    if ([...track.options].some(item => item.value === prior)) track.value = prior;
    pruneRoleKeys();
    applySavedRole();
    status.textContent = (data.demo ? "Demo set" : "Live session") + " · " +
      Math.round(session.tempo * 10) / 10 + " BPM · " + tracks.length + " channels";
    render();
  } catch (error) {
    status.textContent = (tracks.length ? "Showing the previous snapshot. " : "") + error.message;
  } finally {
    refresh.disabled = false;
  }
}
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {} },
  keys() { try { return Object.keys(localStorage); } catch { return []; } },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};
const savedRoleKey = () => "caddy.role:" + track.value;
function pruneRoleKeys() {
  // Drop role keys for tracks that no longer exist. One sweep; only our own prefixes.
  const valid = new Set([...track.options].map(item => item.value));
  for (const key of store.keys()) {
    if (key.startsWith("caddy.role:") && !valid.has(key.slice("caddy.role:".length))) store.remove(key);
  }
}
function applySavedRole() {
  const saved = store.get(savedRoleKey());
  role.value = saved && [...role.options].some(o => o.value === saved) ? saved : "auto";
}
track.addEventListener("change", () => {applySavedRole(); render();});
role.addEventListener("change", () => {
  if (track.value) store.set(savedRoleKey(), role.value === "auto" ? null : role.value);
  render();
});
focus.addEventListener("change", () => {store.set("caddy.focus", focus.value); render();});
refresh.addEventListener("click", loadSession);
el("export").addEventListener("click", () => {
  const lines = ["# Ableton Caddy notes", "", status.textContent, ""];
  for (const row of tracks) {
    const guessed = Object.keys(rolePatterns).find(k => rolePatterns[k].test(row.name)) || "general";
    const options = recipes[focus.value];
    lines.push("## " + row.name + " — role: " + guessed);
    lines.push(Array.isArray(row.devices)
      ? "Chain: " + (row.devices.join(" → ") || "no devices")
      : "Chain: not listed for return tracks");
    for (const card of [...new Set([
      ...options.filter(c => c[3] === guessed),
      ...options.filter(c => c[3] === "general"),
    ])]) {
      lines.push("", "### " + card[0], card[1], card[2]);
      const st = chainStatus(card, row);
      if (st) lines.push("Chain status: " + st);
    }
    lines.push("");
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], {type: "text/markdown"}));
  a.download = "caddy-notes.md";
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
copy.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(note.value);
    el("copy-status").textContent = "Copied. Paste into Edit Info Text in Live.";
  } catch {
    note.focus();
    note.select();
    el("copy-status").textContent = "Copy the selected text manually.";
  }
});
refresh.hidden = demoMode;
const savedFocus = store.get("caddy.focus");
if (savedFocus && [...focus.options].some(o => o.value === savedFocus)) focus.value = savedFocus;
loadSession();
</script>
</html>
